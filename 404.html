<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var s = localStorage.getItem("theme");
                if (s === "light" || s === "dark") document.documentElement.setAttribute("data-theme", s);
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
